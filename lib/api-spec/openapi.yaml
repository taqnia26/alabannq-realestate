openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/maps/resolve:
    post:
      operationId: resolveGoogleMapsLocation
      summary: Resolve an exact property pin from a Google Maps sharing URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleMapsLink"
      responses:
        "200":
          description: Exact pin coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleMapsLocation"
        "400":
          description: Invalid link or no unambiguous property pin
        "401":
          description: Administrator sign-in required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    GoogleMapsLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 4000
    GoogleMapsLocation:
      type: object
      required: [latitude, longitude, sourceUrl]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        sourceUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

