openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/change-password:
    post:
      operationId: changeAdminPassword
      summary: Change the signed-in administrator's password and rotate the session
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "204":
          description: Password changed; a fresh session cookie replaces all previous sessions
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
        "400":
          description: Invalid body or new password matches the current password or email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "401":
          description: Missing or expired session, incorrect current password, or concurrent session change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "403":
          description: Cross-origin request denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "429":
          description: More than five requests per minute from the same IP
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "500":
          description: Password change could not be completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
  /admin/maps/resolve:
    post:
      operationId: resolveGoogleMapsLocation
      summary: Resolve an exact property pin from a Google Maps sharing URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleMapsLink"
      responses:
        "200":
          description: Exact pin coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleMapsLocation"
        "400":
          description: Invalid link or no unambiguous property pin
        "401":
          description: Administrator sign-in required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: alabnq_admin_session
  schemas:
    AdminPasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
    AuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    GoogleMapsLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 4000
    GoogleMapsLocation:
      type: object
      required: [latitude, longitude, sourceUrl]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        sourceUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

